[project]
name = "energy-core"
version = "0.1.0"
description = "Shared domain, config, and persistence for energy monitoring"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28.1",
    "onekommafive>=0.1.46",
    "tzdata>=2026.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_core"]
