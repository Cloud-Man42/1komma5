[project]
name = "energy-monorepo"
version = "0.1.0"
description = "EMIC — Energy Monitoring In a Cloud monorepo"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[tool.uv.workspace]
members = ["packages/energy-core", "backend", "collector"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/energy-core/tests", "backend/tests", "collector/tests", "tests"]
markers = [
    "integration: tests requiring PostgreSQL/TimescaleDB or outbound network access",
]

[tool.ruff]
line-length = 100
target-version = "py312"
