name: EMIC
options:
  bundleIdPrefix: net.inacloud.emic
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  EMICKit:
    type: framework
    platform: iOS
    sources:
      - path: EMICKit/Sources
    resources:
      - path: EMICKit/Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.inacloud.emic.kit
      INFOPLIST_KEY_CFBundleDisplayName: EMICKit
  EMICKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EMICKit/Tests
      - path: Fixtures
        type: folder
        buildPhase: none
    dependencies:
      - target: EMICKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.inacloud.emic.kit.tests
  EMIC:
    type: application
    platform: iOS
    sources:
      - path: EMIC/Sources
    dependencies:
      - target: EMICKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.inacloud.emic.app
      INFOPLIST_KEY_CFBundleDisplayName: EMIC
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: EMIC/EMIC.entitlements
    info:
      path: EMIC/Info.plist
      properties:
        CFBundleDisplayName: EMIC
        UILaunchScreen: {}
  EMICWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: EMICWidgets/Sources
    dependencies:
      - target: EMICKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.inacloud.emic.widgets
      INFOPLIST_KEY_CFBundleDisplayName: EMIC Status
      INFOPLIST_KEY_NSExtension:
        NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: EMICWidgets/EMICWidgets.entitlements
    info:
      path: EMICWidgets/Info.plist
      properties:
        CFBundleDisplayName: EMIC Status
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  EMIC:
    build:
      targets:
        EMIC: all
        EMICWidgets: all
        EMICKit: all
    test:
      targets:
        - EMICKitTests
    run:
      config: Debug
  EMICKit:
    build:
      targets:
        EMICKit: all
    test:
      targets:
        - EMICKitTests
