[project]
name = "energy-backend"
version = "0.1.0"
description = "FastAPI backend for energy monitoring"
requires-python = ">=3.12"
dependencies = [
    "energy-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
energy-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
