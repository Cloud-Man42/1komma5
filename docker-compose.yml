services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      CADDY_LAN_HOST: ${CADDY_LAN_HOST:-192.168.50.54}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    volumes:
      - emic_secrets:/var/lib/emic
    environment:
      EMIC_SECRET_KEY: ${EMIC_SECRET_KEY:-}
      EMIC_SECRET_KEY_PATH: /var/lib/emic/secret.key
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-energy}
      HEARTBEAT_PROVIDER: ${HEARTBEAT_PROVIDER:-mock}
      HEARTBEAT_POLL_INTERVAL: ${HEARTBEAT_POLL_INTERVAL:-60}
      HEARTBEAT_API_URL: ${HEARTBEAT_API_URL:-}
      HEARTBEAT_API_KEY: ${HEARTBEAT_API_KEY:-}
      CHARGEAMPS_PROVIDER: ${CHARGEAMPS_PROVIDER:-}
      CHARGEAMPS_MOCK: ${CHARGEAMPS_MOCK:-false}
      CHARGEAMPS_API_KEY: ${CHARGEAMPS_API_KEY:-}
      CHARGEAMPS_EMAIL: ${CHARGEAMPS_EMAIL:-}
      CHARGEAMPS_PASSWORD: ${CHARGEAMPS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_TIMESCALEDB: "true"
      ARCTIC_SPA_ENABLED: ${ARCTIC_SPA_ENABLED:-false}
      ARCTIC_SPA_API_BASE_URL: ${ARCTIC_SPA_API_BASE_URL:-https://api.myarcticspa.com}
      ARCTIC_SPA_API_KEY: ${ARCTIC_SPA_API_KEY:-}
      ARCTIC_SPA_POLL_INTERVAL_SECONDS: ${ARCTIC_SPA_POLL_INTERVAL_SECONDS:-60}
      SPA_ENERGY_COLLECTION_ENABLED: ${SPA_ENERGY_COLLECTION_ENABLED:-true}
      SPA_COST_CALCULATION_ENABLED: ${SPA_COST_CALCULATION_ENABLED:-true}
      WIDGET_STALE_SECONDS: ${WIDGET_STALE_SECONDS:-120}
      WIDGET_SNAPSHOT_CACHE_SECONDS: ${WIDGET_SNAPSHOT_CACHE_SECONDS:-15}
      WIDGET_SAVINGS_CACHE_SECONDS: ${WIDGET_SAVINGS_CACHE_SECONDS:-300}
      WIDGET_RATE_LIMIT_PER_MINUTE: ${WIDGET_RATE_LIMIT_PER_MINUTE:-60}
      EMIC_ADMIN_TOKEN: ${EMIC_ADMIN_TOKEN:-}
      FINANCIAL_AGGREGATES_ENABLED: ${FINANCIAL_AGGREGATES_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DASHBOARD_REDIS_CACHE_TTL_SECONDS: ${DASHBOARD_REDIS_CACHE_TTL_SECONDS:-60}
      SOLAR_FORECAST_REDIS_CACHE_TTL_SECONDS: ${SOLAR_FORECAST_REDIS_CACHE_TTL_SECONDS:-1800}
      SOLAR_FORECAST_L1_WARM_TTL_SECONDS: ${SOLAR_FORECAST_L1_WARM_TTL_SECONDS:-300}
      TIMESCALE_RETENTION_ENABLED: ${TIMESCALE_RETENTION_ENABLED:-false}
      TIMESCALE_COMPRESSION_ENABLED: ${TIMESCALE_COMPRESSION_ENABLED:-false}
      SOLAR_FORECAST_SYNC_REFRESH_ON_READ: ${SOLAR_FORECAST_SYNC_REFRESH_ON_READ:-false}
      ENERGY_CONTROL_PROVIDER: ${ENERGY_CONTROL_PROVIDER:-noop}
      ENERGY_CONTROL_COLLECTOR_ENABLED: ${ENERGY_CONTROL_COLLECTOR_ENABLED:-true}
      HORIZON_OPTIMIZER_REDIS_CACHE_TTL_SECONDS: ${HORIZON_OPTIMIZER_REDIS_CACHE_TTL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    volumes:
      - emic_secrets:/var/lib/emic
    environment:
      EMIC_SECRET_KEY: ${EMIC_SECRET_KEY:-}
      EMIC_SECRET_KEY_PATH: /var/lib/emic/secret.key
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-energy}
      HEARTBEAT_PROVIDER: ${HEARTBEAT_PROVIDER:-mock}
      HEARTBEAT_POLL_INTERVAL: ${HEARTBEAT_POLL_INTERVAL:-60}
      HEARTBEAT_API_URL: ${HEARTBEAT_API_URL:-}
      HEARTBEAT_API_KEY: ${HEARTBEAT_API_KEY:-}
      CHARGEAMPS_PROVIDER: ${CHARGEAMPS_PROVIDER:-}
      CHARGEAMPS_MOCK: ${CHARGEAMPS_MOCK:-false}
      CHARGEAMPS_API_KEY: ${CHARGEAMPS_API_KEY:-}
      CHARGEAMPS_EMAIL: ${CHARGEAMPS_EMAIL:-}
      CHARGEAMPS_PASSWORD: ${CHARGEAMPS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_TIMESCALEDB: "true"
      ARCTIC_SPA_ENABLED: ${ARCTIC_SPA_ENABLED:-false}
      ARCTIC_SPA_API_BASE_URL: ${ARCTIC_SPA_API_BASE_URL:-https://api.myarcticspa.com}
      ARCTIC_SPA_API_KEY: ${ARCTIC_SPA_API_KEY:-}
      ARCTIC_SPA_POLL_INTERVAL_SECONDS: ${ARCTIC_SPA_POLL_INTERVAL_SECONDS:-60}
      SPA_ENERGY_COLLECTION_ENABLED: ${SPA_ENERGY_COLLECTION_ENABLED:-true}
      SPA_COST_CALCULATION_ENABLED: ${SPA_COST_CALCULATION_ENABLED:-true}
      FINANCIAL_AGGREGATES_ENABLED: ${FINANCIAL_AGGREGATES_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DASHBOARD_REDIS_CACHE_TTL_SECONDS: ${DASHBOARD_REDIS_CACHE_TTL_SECONDS:-60}
      SOLAR_FORECAST_REDIS_CACHE_TTL_SECONDS: ${SOLAR_FORECAST_REDIS_CACHE_TTL_SECONDS:-1800}
      SOLAR_FORECAST_L1_WARM_TTL_SECONDS: ${SOLAR_FORECAST_L1_WARM_TTL_SECONDS:-300}
      TIMESCALE_RETENTION_ENABLED: ${TIMESCALE_RETENTION_ENABLED:-false}
      TIMESCALE_COMPRESSION_ENABLED: ${TIMESCALE_COMPRESSION_ENABLED:-false}
      SOLAR_FORECAST_SYNC_REFRESH_ON_READ: ${SOLAR_FORECAST_SYNC_REFRESH_ON_READ:-false}
      ENERGY_CONTROL_PROVIDER: ${ENERGY_CONTROL_PROVIDER:-noop}
      ENERGY_CONTROL_COLLECTOR_ENABLED: ${ENERGY_CONTROL_COLLECTOR_ENABLED:-true}
      HORIZON_OPTIMIZER_REDIS_CACHE_TTL_SECONDS: ${HORIZON_OPTIMIZER_REDIS_CACHE_TTL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m app' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-energy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-energy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energy} -d ${POSTGRES_DB:-energy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  emic_secrets:
